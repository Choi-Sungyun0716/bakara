<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>바카라 카지노</title>
<style>
body { background:#0b3d2e; color:white; text-align:center; font-family:Arial;}
h1 { margin-top:20px; }

#table { margin-top:20px; }

.card {
    width:70px;
    margin:5px;
    opacity:0;
    transform: translateY(-20px);
    transition: all 0.5s;
}

.show {
    opacity:1;
    transform: translateY(0);
}

.chips button {
    margin:5px;
    padding:10px;
    border-radius:50%;
    font-weight:bold;
}

.bet-area button {
    padding:10px 20px;
    margin:10px;
}

</style>
</head>
<body>

<h1>🃏 바카라 카지노</h1>

<p>💰 크레딧: <span id="money">1000</span></p>
<p>🎯 현재 베팅: <span id="betAmount">0</span></p>

<div class="chips">
    <button onclick="addBet(10)">10</button>
    <button onclick="addBet(50)">50</button>
    <button onclick="addBet(100)">100</button>
    <button onclick="addBet(500)">500</button>
</div>

<div class="bet-area">
    <button onclick="play('player')">Player</button>
    <button onclick="play('banker')">Banker</button>
</div>

<div id="table">
    <h3>Player</h3>
    <div id="player"></div>

    <h3>Banker</h3>
    <div id="banker"></div>
</div>

<h2 id="result"></h2>

<audio id="cardSound" src="https://www.soundjay.com/misc/sounds/card-flip-1.mp3"></audio>
<audio id="winSound" src="https://www.soundjay.com/human/sounds/applause-8.mp3"></audio>
<audio id="loseSound" src="https://www.soundjay.com/misc/sounds/fail-buzzer-01.mp3"></audio>

<script>
let money = 1000;
let bet = 0;

function addBet(amount){
    if(bet + amount > money) return;
    bet += amount;
    document.getElementById("betAmount").innerText = bet;
}

function drawCard(){
    let suit = ["H","S","D","C"][Math.floor(Math.random()*4)];
    let num = Math.floor(Math.random()*13)+1;
    return {suit,num};
}

function cardImg(c){
    let n = c.num;
    if(n===1)n="A";
    else if(n===11)n="J";
    else if(n===12)n="Q";
    else if(n===13)n="K";
    return `https://deckofcardsapi.com/static/img/${n}${c.suit}.png`;
}

function val(c){
    if(c.num>=10) return 0;
    return c.num;
}

function total(cards){
    return cards.reduce((a,c)=>a+val(c),0)%10;
}

function play(choice){
    if(bet===0) return alert("베팅하세요");

    let player=[drawCard(),drawCard()];
    let banker=[drawCard(),drawCard()];

    let pTotal = total(player);
    let bTotal = total(banker);

    // 자연승
    if(pTotal<8 && bTotal<8){
        // Player 3번째 카드
        if(pTotal<=5){
            player.push(drawCard());
        }

        // Banker 규칙
        if(bTotal<=2) banker.push(drawCard());
        else if(bTotal===3 && val(player[2])!==8) banker.push(drawCard());
        else if(bTotal===4 && val(player[2])>=2 && val(player[2])<=7) banker.push(drawCard());
        else if(bTotal===5 && val(player[2])>=4 && val(player[2])<=7) banker.push(drawCard());
        else if(bTotal===6 && (val(player[2])===6 || val(player[2])===7)) banker.push(drawCard());
    }

    render("player",player);
    render("banker",banker);

    setTimeout(()=>{
        pTotal = total(player);
        bTotal = total(banker);

        let result="";
        let winner="";

        if(pTotal>bTotal) winner="player";
        else if(bTotal>pTotal) winner="banker";
        else winner="tie";

        if(winner===choice){
            if(winner==="banker"){
                money += bet*0.95;
            }else{
                money += bet;
            }
            result="🎉 승리";
            document.getElementById("winSound").play();
        }else if(winner==="tie"){
            result="🤝 무승부";
        }else{
            money -= bet;
            result="❌ 패배";
            document.getElementById("loseSound").play();
        }

        bet=0;
        document.getElementById("betAmount").innerText=0;
        document.getElementById("money").innerText=money;
        document.getElementById("result").innerText =
            `Player ${pTotal} vs Banker ${bTotal} → ${result}`;

    },1200);
}

function render(id,cards){
    let div=document.getElementById(id);
    div.innerHTML="";
    cards.forEach((c,i)=>{
        let img=document.createElement("img");
        img.src=cardImg(c);
        img.className="card";
        div.appendChild(img);

        setTimeout(()=>{
            img.classList.add("show");
            document.getElementById("cardSound").play();
        },i*300);
    });
}
</script>

</body>
</html>
