<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>바카라 카지노</title>

<style>
body {
    background:#0b3d2e;
    color:white;
    text-align:center;
    font-family:Arial;
}

/* 룰북 */
#rules {
    position: fixed;
    left: -320px;
    top: 0;
    width: 320px;
    height: 100%;
    background: #1e1e1e;
    padding: 20px;
    overflow-y: auto;
    transition: 0.3s;
    z-index: 999;
}
#rules.open { left:0; }

/* 버튼 */
button {
    padding:10px 15px;
    margin:5px;
    cursor:pointer;
}

/* 카드 */
.card {
    width:70px;
    margin:5px;
    opacity:0;
    transform:translateY(-20px);
    transition:0.5s;
}
.show {
    opacity:1;
    transform:translateY(0);
}

/* 칩 */
.chips button {
    border-radius:50%;
    font-weight:bold;
}

/* 상단 버튼 */
#toggleBtn {
    position:fixed;
    left:10px;
    top:10px;
    z-index:1000;
}

</style>
</head>

<body>

<!-- 룰 버튼 -->
<button id="toggleBtn" onclick="toggleRules()">📘 룰</button>

<!-- 룰북 -->
<div id="rules">
<h2>📘 바카라 룰</h2>

<h4>기본</h4>
<p>Player vs Banker 중 선택</p>

<h4>카드 값</h4>
<p>A=1 / 2~9 숫자 / 10,J,Q,K=0</p>

<h4>자연승</h4>
<p>8,9 나오면 즉시 종료</p>

<h4>3번째 카드</h4>
<p>
Player 0~5 → 추가<br>
Banker는 Player 카드에 따라 결정
</p>

<h4>배당</h4>
<p>
Player 1배<br>
Banker 0.95배
</p>
</div>

<h1>🃏 바카라 카지노</h1>

<p>💰 크레딧: <span id="money">1000</span></p>
<p>🎯 베팅: <span id="betAmount">0</span></p>

<div class="chips">
<button onclick="addBet(10)">10</button>
<button onclick="addBet(50)">50</button>
<button onclick="addBet(100)">100</button>
<button onclick="addBet(500)">500</button>
</div>

<div>
<button onclick="play('player')">Player</button>
<button onclick="play('banker')">Banker</button>
</div>

<h3>Player</h3>
<div id="player"></div>

<h3>Banker</h3>
<div id="banker"></div>

<h2 id="result"></h2>

<audio id="cardSound" src="https://www.soundjay.com/misc/sounds/card-flip-1.mp3"></audio>
<audio id="winSound" src="https://www.soundjay.com/human/sounds/applause-8.mp3"></audio>
<audio id="loseSound" src="https://www.soundjay.com/misc/sounds/fail-buzzer-01.mp3"></audio>

<script>
let money = 1000;
let bet = 0;

function toggleRules(){
    document.getElementById("rules").classList.toggle("open");
}

function addBet(amount){
    if(bet + amount > money) return;
    bet += amount;
    document.getElementById("betAmount").innerText = bet;
}

function drawCard(){
    let suit=["H","S","D","C"][Math.floor(Math.random()*4)];
    let num=Math.floor(Math.random()*13)+1;
    return {suit,num};
}

function img(c){
    let n=c.num;
    if(n===1)n="A";
    else if(n===11)n="J";
    else if(n===12)n="Q";
    else if(n===13)n="K";
    return `https://deckofcardsapi.com/static/img/${n}${c.suit}.png`;
}

function val(c){
    return c.num>=10 ? 0 : c.num;
}

function total(cards){
    return cards.reduce((a,c)=>a+val(c),0)%10;
}

function play(choice){
    if(bet===0) return alert("베팅하세요");

    let player=[drawCard(),drawCard()];
    let banker=[drawCard(),drawCard()];

    let p=total(player);
    let b=total(banker);

    if(p<8 && b<8){
        if(p<=5) player.push(drawCard());

        let p3 = player[2] ? val(player[2]) : null;

        if(b<=2) banker.push(drawCard());
        else if(b===3 && p3!==8) banker.push(drawCard());
        else if(b===4 && p3>=2 && p3<=7) banker.push(drawCard());
        else if(b===5 && p3>=4 && p3<=7) banker.push(drawCard());
        else if(b===6 && (p3===6 || p3===7)) banker.push(drawCard());
    }

    render("player",player);
    render("banker",banker);

    setTimeout(()=>{
        p=total(player);
        b=total(banker);

        let winner = p>b ? "player" : b>p ? "banker" : "tie";
        let result="";

        if(winner===choice){
            if(winner==="banker") money += bet*0.95;
            else money += bet;
            result="🎉 승리";
            document.getElementById("winSound").play();
        } else if(winner==="tie"){
            result="🤝 무승부";
        } else {
            money -= bet;
            result="❌ 패배";
            document.getElementById("loseSound").play();
        }

        bet=0;
        document.getElementById("betAmount").innerText=0;
        document.getElementById("money").innerText=money;
        document.getElementById("result").innerText =
            `Player ${p} vs Banker ${b} → ${result}`;
    },1200);
}

function render(id,cards){
    let div=document.getElementById(id);
    div.innerHTML="";
    cards.forEach((c,i)=>{
        let imgEl=document.createElement("img");
        imgEl.src=img(c);
        imgEl.className="card";
        div.appendChild(imgEl);

        setTimeout(()=>{
            imgEl.classList.add("show");
            document.getElementById("cardSound").play();
        }, i*300);
    });
}
</script>

</body>
</html>
